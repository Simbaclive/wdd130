<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz | WDD 130</title>
    <meta name="description" content="An interactive quiz about HTML and CSS for WDD 130.">
    <meta name="author" content="Simba Clive Musika">
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>HTML & CSS Quiz</h1>
    </header>
    <main>
        <form method="get" action="#">
            
          
            <div class="question">
                <label for="q1">1. What does CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

           
            <div class="question">
                <label for="q2">2. Explain the purpose of the CSS box model in a few sentences.</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

           
            <div class="question">
                <label for="q3">3. Which HTML tag is used to define an internal style sheet?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="style">&lt;style&gt;</option>
                    <option value="css">&lt;css&gt;</option>
                    <option value="script">&lt;script&gt;</option>
                </select>
            </div>

         
            <div class="question">
                <label for="q4">4. How many heading levels (from largest to smallest) does HTML support?</label>
                <input type="number" id="q4" name="q4">
            </div>

      
            <button type="submit">Submit Quiz</button>

        </form>
    </main>
    <footer>
        <p>&copy; 2026 | HTML & CSS Quiz Form</p>
    </footer>
</body>
</html>
